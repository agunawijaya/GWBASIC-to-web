# ---------------------------------------------------------------------------
# DOSBox-X profile for the Classic DOS BASIC Games collection.
#
# Target hardware: IBM PC 5150, 4.77 MHz 8088, CGA, 640 KB, PC speaker.
# That is what every program in run\ was written for -- a survey of the
# sources shows only SCREEN 0 (text), SCREEN 1 (320x200 CGA) and SCREEN 2
# (640x200 CGA), so nothing here needs EGA or VGA.
#
# The launchers in run\ pass the mount and the command line themselves, which
# is why [autoexec] below is deliberately empty.
# ---------------------------------------------------------------------------

[sdl]
fullscreen        = false
autolock          = true
waitonerror       = true

# openglnb = OpenGL with nearest-neighbour filtering.  Required for the 5x
# zoom below to come out as crisp square pixels instead of a blurred stretch.
output            = openglnb

[dosbox]
title             = Classic DOS BASIC Games
machine           = cga
memsize           = 1

[render]
# --- 5x zoom -------------------------------------------------------------
# 'forced' makes DOSBox-X apply the scaler in every video mode, not only the
# ones it thinks need it.
#
# What 5x actually gives you on this 1920x1200 display:
#   SCREEN 1  320x200 graphics -> 1600x1000.  Exactly 5x, fits the desktop.
#   SCREEN 2  640x200 graphics -> 3200x1000.  Wider than the desktop.
#   SCREEN 0  80-column text   -> 3200x1000.  Wider than the desktop.
# Most programs here are 80-column text, so for those the window is clamped
# to the screen width rather than a literal 5x.  If you would rather have
# every mode fit, change the line below to normal3x (1920x600 for text) or
# normal4x, or press Alt+Enter for fullscreen.
scaler            = normal5x forced

# aspect=false keeps the scaling a whole-number multiple in both directions.
# Turning it on restores the squat 4:3 look of a real CGA monitor, but then
# the vertical scale is no longer exactly 5x.
aspect            = false
doublescan        = false

[cpu]
# cycles=fixed 315 approximates a 4.77 MHz 8088.  The action games
# (BREAKOUT, METEOR, ABM2A, FLYS, ATTACK) are timed by raw loop speed and
# become unplayable if you raise it.  Ctrl+F11 / Ctrl+F12 adjust it live.
core              = normal
cputype           = auto
cycles            = fixed 315

[speaker]
pcspeaker         = true
tandy             = off

[joystick]
joysticktype      = none

[dos]
keyboardlayout    = us
xms               = true
ems               = true

[autoexec]
# intentionally empty -- see run\*.bat
